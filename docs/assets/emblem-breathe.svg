  <circle class="r2" cx="32" cy="32" r="19" fill="none" stroke="#4285f4" stroke-width="3" stroke-dasharray="7 3" opacity=".75"/>
  <circle class="r3" cx="32" cy="32" r="27" fill="none" stroke="#4285f4" stroke-width="2.5" stroke-dasharray="2.5 4.5" opacity=".5"/></g>
  
