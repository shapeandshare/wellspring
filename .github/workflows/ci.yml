# CI gates for Wellspring: runs the same make targets contributors run locally.
# Heavy targets (abliterate, convert-*, optimize*) are never run in CI;
# they need GPUs and ~72 GB checkpoints.

name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: make test
        run: make test

  vault-audit:
    name: vault-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: make vault-audit
        run: make vault-audit
