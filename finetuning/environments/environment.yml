name: finetuning
channels:
  - defaults
  - conda-forge
dependencies:
  - defaults:python>=3.10
  - defaults:mlx-lm>=0.18
  - defaults:safetensors>=0.4
  - defaults:numpy>=1.24
  - defaults:matplotlib>=3.7
  - defaults:pip

  # Development
  - conda-forge:ruff

# Notes:
# - mlx-lm and its mlx dependency are Apple Silicon (osx-arm64) only, published on
#   Anaconda's own `main` channel (aliased here as `defaults`) — not conda-forge.
#   This environment can only be locked/solved for the osx-arm64 platform; see
#   `make lock` / environments/osx-arm64.lock.
# - conda-lock and mamba are intentionally NOT listed here (bootstrap chicken-and-egg:
#   they're what *creates* this env). Install them once in your base env instead:
#     conda install -n base -c conda-forge conda-lock mamba
# - Version floors match requirements.txt (the pip-only alternative install path);
#   keep the two in sync when bumping either.
