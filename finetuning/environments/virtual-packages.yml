# conda-lock's own default (__osx: "11.0") is older than mlx's actual macOS floor, so
# `conda-lock lock` fails to solve unless we tell it what macOS this lock targets.
# 14.5 unlocks the newest available mlx/mlx-lm builds; bump if a future mlx raises its floor.
subdirs:
  osx-arm64:
    packages:
      __unix: "0"
      __archspec: "1 arm64"
      __osx: "14.5"
