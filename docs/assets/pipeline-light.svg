<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes nb { 0%,100% { opacity:0.75; } 50% { opacity:1; } }
    @keyframes ng { 0%,100% { opacity:0.8; } 50% { opacity:1; } }
    @keyframes no { 0%,100% { opacity:0.75; } 50% { opacity:1; } }
    @keyframes ab { 0%,40% { opacity:0.2; } 50%,90% { opacity:1; } 100% { opacity:0.2; } }
    .nb { animation: nb 3s ease-in-out infinite; }
    .ng { animation: ng 2.5s ease-in-out infinite 0.2s; }
    .no { animation: no 3s ease-in-out infinite 0.4s; }
    .a1 { animation: ab 2s ease-in-out infinite; }
    .a2 { animation: ab 2s ease-in-out infinite 0.4s; }
    .a3 { animation: ab 2s ease-in-out infinite 0.8s; }
    .a4 { animation: ab 2s ease-in-out infinite 1.2s; }
  </style>
  <rect width="900" height="474" fill="url(#pbg)" rx="12"/>
  <text x="450" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">PIPELINE</text>

  <!-- === ROW 1: HF Hub → Heretic → Decensored === -->
  <!-- HF Hub box: x=80..230 y=46..96 center-y=71 -->
  <rect class="nb" x="80" y="46" width="150" height="50" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
