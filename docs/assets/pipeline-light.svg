  <rect x="30" y="412" width="840" height="48" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="431" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#b91c1c">OPTIONAL · FINETUNE=1 — fine-tune a sleeper lineup of the upstream model, before or after Heretic (STAGE_ORDER)</text>
  <text x="450" y="449" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#475569">QA gate + secrecy-checked handover → every variant exported through both paths above → Blue audit (weight-diff MRI + probe)</text>
