<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 232">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes mb { 0%,100% { opacity:0.75; } 50% { opacity:1; } }
    @keyframes mg { 0%,100% { opacity:0.8; } 50% { opacity:1; } }
    @keyframes ma { 0%,40% { opacity:0.2; } 50%,90% { opacity:1; } 100% { opacity:0.2; } }
    .mb { animation: mb 3s ease-in-out infinite; }
    .mg { animation: mg 2.5s ease-in-out infinite 0.2s; }
    .a1 { animation: ma 2s ease-in-out infinite; }
    .a2 { animation: ma 2s ease-in-out infinite 0.3s; }
    .a3 { animation: ma 2s ease-in-out infinite 0.6s; }
    .a4 { animation: ma 2s ease-in-out infinite 0.9s; }
    .wire { fill: none; stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
