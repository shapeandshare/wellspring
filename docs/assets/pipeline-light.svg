  <rect class="ng" x="312" y="46" width="180" height="50" rx="25" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="402" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">Heretic · abliterate</text>
  <text x="402" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#b45309">Optuna · MERGE strategy</text>

